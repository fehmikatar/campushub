# Notification (API + consommateur RabbitMQ) + RabbitMQ + MySQL, pour le développement.
#   docker compose up --build
# API : http://localhost:8085/docs/   RabbitMQ : http://localhost:15672 (guest / guest)
# MySQL est exposé sur 3307 pour ne pas entrer en conflit avec un MySQL local sur 3306.

x-notification-env: &notification-env
  APP_ENV: local
  APP_DEBUG: "true"
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: campushub_notification
  DB_USERNAME: root
  DB_PASSWORD: root
  SESSION_DRIVER: array
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  MAIL_MAILER: log
  JWT_SECRET: ${JWT_SECRET:-dev-secret}
  JWT_ISSUER: campushub-user-service
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-key}
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campushub_notification
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (pas localhost) : localhost passe par le socket Unix, ouvert pendant l'init temporaire de MySQL.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  notification-api:
    build: .
    image: campushub/notification-service
    environment: *notification-env
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Clé d'application de développement générée au démarrage (rien de secret dans le dépôt).
    command: >
      sh -c 'export APP_KEY=$$(php artisan key:generate --show) &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8085'
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8085/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30

  notification-consumer:
    build: .
    image: campushub/notification-service
    pull_policy: never
    environment: *notification-env
    depends_on:
      notification-api:
        condition: service_healthy
    command: >
      sh -c 'export APP_KEY=$$(php artisan key:generate --show) &&
             php artisan rabbitmq:consume'
    restart: unless-stopped

  # Enregistre le service dans Eureka (lancé sur la machine hôte) pour que la Gateway le trouve (lb://notification-service).
  # L'instance est annoncée sur localhost:8085, port publié par notification-api.
  notification-eureka:
    build: .
    image: campushub/notification-service
    pull_policy: never
    environment:
      <<: *notification-env
      EUREKA_HOST: host.docker.internal
      EUREKA_INSTANCE_HOST: localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      notification-api:
        condition: service_healthy
    command: >
      sh -c 'export APP_KEY=$$(php artisan key:generate --show) &&
             php artisan eureka:register'
    restart: unless-stopped

volumes:
  mysql-data:
