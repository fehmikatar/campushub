# Local development profile (the default, see application.yml).
#
# The database password is still required: set DB_PASSWORD, or put it in a git-ignored
# config/application-local.yml. Startup fails with an explicit message if it is missing.

logging:
  level:
    com.campushub.userservice: DEBUG

campushub:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}