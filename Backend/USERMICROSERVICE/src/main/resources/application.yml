spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # MySQL 8.4. Host, port, database and user have defaults; the password never does.
  # The URL parameters keep the JDBC session in UTC, matching the DATETIME(6)/UTC columns.
  datasource:
    url: "${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campushub_users}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true}"
    username: ${DB_USERNAME:campushub_app}
    password: ${DB_PASSWORD}

  # Keycloak : le service vérifie les tokens, il n'en crée aucun.
  security:
    oauth2:
      resourceserver:
        jwt:
          # iss attendu dans les tokens (adresse vue par le navigateur)
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/campushub}
          # clés publiques lues directement (en Docker : http://keycloak:8080/...)
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/campushub/protocol/openid-connect/certs}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        type:
          # UUIDs stored as CHAR(36), readable in a MySQL client (see V1__create_users.sql).
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Never adopt a non-empty database that has no CampusHub migration history.
    baseline-on-migrate: false

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

campushub:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Nom sous lequel la Gateway joint le service (en Docker : user-service)
    hostname: ${EUREKA_INSTANCE_HOST:localhost}