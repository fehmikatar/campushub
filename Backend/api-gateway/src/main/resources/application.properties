spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# CORS : origines autorisees (front Angular)
campushub.cors.allowed-origins=http://localhost:4200

# User Service : adresse directe, pas encore dans Eureka
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/**

# Forum Service : /api/v1/forum/... devient /api/v1/... cote service
spring.cloud.gateway.server.webmvc.routes[1].id=forum-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://forum-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/forum/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=RewritePath=/api/v1/forum/(?<segment>.*), /api/v1/$\{segment}

# Evaluation Service : /api/v1/evaluation/... devient /api/... cote service
spring.cloud.gateway.server.webmvc.routes[2].id=evaluation-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://evaluation-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/evaluation/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=RewritePath=/api/v1/evaluation/(?<segment>.*), /api/$\{segment}

# Notification Service : /api/v1/notifications/... devient /api/notifications/... cote service
# (les routes /api/internal/** ne sont volontairement pas exposees)
spring.cloud.gateway.server.webmvc.routes[3].id=notification-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/notifications/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=RewritePath=/api/v1/notifications(?<segment>/?.*), /api/notifications$\{segment}

# Course Service : /api/v1/courses/... devient /courses/... cote service
spring.cloud.gateway.server.webmvc.routes[4].id=course-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://course-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/courses/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=RewritePath=/api/v1/courses(?<segment>.*), /courses$\{segment}


# Images de cours (fichiers statiques de Course) : /uploads/... passe tel quel
spring.cloud.gateway.server.webmvc.routes[5].id=course-uploads
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://course-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/uploads/**


# Reclamation Service (Django) : /api/v1/reclamation/... devient /api/... cote service
# Django revalide le JWT puis applique les roles et la propriete (author_sub, owner_sub).
spring.cloud.gateway.server.webmvc.routes[6].id=reclamation-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://reclamation-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/reclamation/**
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=RewritePath=/api/v1/reclamation(?<segment>/?.*), /api$\{segment}


# Keycloak : le Gateway valide les tokens (signature via les cles publiques du realm)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/campushub}
# PDF Course : 20 MiB par fichier, marge pour les en-tetes multipart.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
