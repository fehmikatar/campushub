<a class="back" routerLink="/forum" [queryParams]="{ cours: courseId || null }">
  <app-icon [name]="icons.chevronLeft" [size]="16" /> Forum
</a>
<h1>Nouveau sujet</h1>

@if (!courseId) {
  <div class="alert" role="alert">
    Aucun cours choisi. Revenez au <a routerLink="/forum">forum</a> et choisissez un cours avant de poser une question.
  </div>
} @else {
  <form class="card form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as message) {
      <div class="alert" role="alert">{{ message }}</div>
    }

    <label class="field">
      <span>Titre <small class="muted">{{ titleLength() }}/150</small></span>
      <input type="text" formControlName="title" maxlength="150" placeholder="Résumez votre question" [class.invalid]="(form.controls.title.touched || submitted()) && form.controls.title.invalid" />
      @if ((form.controls.title.touched || submitted()) && form.controls.title.invalid) {
        <small class="error">Le titre doit faire entre 5 et 150 caractères.</small>
      }
    </label>

    <label class="field narrow">
      <span>Catégorie <small class="muted">(facultatif)</small></span>
      <select formControlName="categoryId">
        <option value="">Aucune</option>
        @for (category of categories(); track category._id) {
          <option [value]="category._id">{{ category.name }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>Étiquettes <small class="muted">(séparées par des virgules, 5 maximum)</small></span>
      <input type="text" formControlName="tags" placeholder="angular, signaux" [class.invalid]="tagsError" />
      @if (tagsError; as message) {
        <small class="error">{{ message }}</small>
      }
    </label>

    <div class="field">
      <span>Message</span>
      <app-markdown-editor [(value)]="content" [rows]="10" [invalid]="submitted() && contentInvalid" placeholder="Décrivez votre problème. Le Markdown est accepté." />
      @if (submitted() && contentInvalid) {
        <small class="error">Le message est obligatoire (10 000 caractères maximum).</small>
      }
    </div>

    <div class="actions">
      <a class="btn btn-secondary" routerLink="/forum" [queryParams]="{ cours: courseId }">Annuler</a>
      <button type="submit" class="btn btn-primary" [disabled]="saving()">{{ saving() ? 'Publication...' : 'Publier le sujet' }}</button>
    </div>
  </form>
}
