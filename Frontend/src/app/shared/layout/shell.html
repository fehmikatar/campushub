<div class="layout">
  <aside class="sidebar">
    <a class="brand" routerLink="/">
      <app-icon [name]="icons.graduationCap" [size]="26" />
      <span>CampusHub</span>
    </a>
    <nav aria-label="Navigation principale">
      @for (item of menu(); track item.path) {
        <a class="nav-item" [routerLink]="item.path" routerLinkActive="active">
          <app-icon [name]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <button type="button" class="theme-toggle" role="switch" [attr.aria-checked]="theme.dark()" (click)="theme.toggle()">
      <app-icon [name]="theme.dark() ? icons.moon : icons.sun" [size]="18" />
      <span>Mode sombre</span>
      <span class="switch" [class.on]="theme.dark()" aria-hidden="true"></span>
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <label class="search">
        <app-icon [name]="icons.search" [size]="16" />
        <input type="search" placeholder="Rechercher..." aria-label="Rechercher" />
      </label>

      <app-notification-bell />

      <div class="account">
        <button type="button" class="account-button" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()">
          <span class="avatar">{{ initials() }}</span>
          <span class="identity">
            <strong>{{ user()?.prenom }} {{ user()?.nom }}</strong>
            <small>{{ roleLabel() }}</small>
          </span>
          <app-icon [name]="icons.chevronDown" [size]="16" />
        </button>
        @if (menuOpen()) {
          <div class="dropdown">
            <a class="dropdown-item" routerLink="/profil" (click)="menuOpen.set(false)">
              <app-icon [name]="icons.user" [size]="16" />
              Mon profil
            </a>
            <button type="button" (click)="logout()">
              <app-icon [name]="icons.logOut" [size]="16" />
              Se déconnecter
            </button>
          </div>
        }
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
