# CampusHub - lancement dockerise (une seule machine)
#   docker compose up --build -d
# Acces : Gateway http://localhost:8080 | Keycloak http://localhost:8180 (admin/admin)
#         Eureka http://localhost:8761  | RabbitMQ http://localhost:15672 (guest/guest)
#
# Chaque service ajoute SON bloc ici.
# Les services pas encore dockerises tournent sur la machine hote : la Gateway et Forum
# les joignent par host.docker.internal.

name: campushub

include:
  - path: Backend/notification-service/docker-compose.yml
  - path: Frontend/docker-compose.yml

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mongo:
    image: mongo:7
    # Pas de port publie : evite le conflit avec un MongoDB local sur 27017
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  eureka-server:
    build: ./Backend/eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api-gateway:
    build: ./Backend/api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # iss attendu dans les tokens (adresse vue par le navigateur)
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      # cles publiques lues par le reseau Docker
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      USER_SERVICE_URI: http://user-service:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_started

  forum-service:
    build: ./Backend/forum-service
    environment:
      PORT: 8086
      MONGO_URI: mongodb://mongo:27017/campushub_forum
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      EUREKA_ENABLED: "true"
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOST: forum-service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_QUEUE: forum.events
      # "true" : Forum verifie l'existence du cours aupres de Course (404 si inconnu)
      COURSE_CHECK_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  # Course Service et sa base PostgreSQL
  course-service:
    build: ./Backend/course-service
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: "8082"
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: course_db
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      EUREKA_ENABLED: "true"
      EUREKA_HOST: eureka-server
      EUREKA_PORT: "8761"
      EUREKA_INSTANCE_HOST: course-service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: course_db
    volumes:
      - course_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Evaluation (SQL Server + API .NET + migrations EF) ---
  # Mot de passe SA : definir MSSQL_SA_PASSWORD dans un fichier .env a la racine (non committe).
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-CampusHub!2026}
    # Pas de port publie (les migrations et l'API passent par le reseau Docker).
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Applique les migrations EF une seule fois, puis s'arrete (voir Dockerfile, etape "migrate").
  evaluation-migrate:
    build:
      context: ./Backend/evaluation-service
      target: migrate
    image: campushub/evaluation-service-migrate
    environment:
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=EvaluationDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-CampusHub!2026};TrustServerCertificate=True;"
      # Suffit a demarrer le host en mode Keycloak (sinon JWT_SECRET serait exige).
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"

  evaluation-service:
    build: ./Backend/evaluation-service
    image: campushub/evaluation-service
    environment:
      # Definition = Swagger disponible sur http://localhost:8084/swagger
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8084
      Urls: http://0.0.0.0:8084
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=EvaluationDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-CampusHub!2026};TrustServerCertificate=True;"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # iss vu par le navigateur ; cles publiques lues par le reseau Docker (comme forum/gateway).
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      # Enregistrement dans l'Eureka du compose (la Gateway resout lb://evaluation-service).
      Eureka__Client__ServiceUrl: http://eureka-server:8761/eureka/
      Eureka__Instance__HostName: evaluation-service
      Eureka__Instance__Port: "8084"
      Eureka__Instance__InstanceId: evaluation-service:8084
      # Course tourne encore sur la machine hote (PostgreSQL, port 8082).
      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL:-http://course-service:8082}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
    ports:
      - "8084:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_started
      evaluation-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  enrollment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enrollment_db
      POSTGRES_USER: enrollment
      POSTGRES_PASSWORD: enrollment_dev_password
    volumes:
      - enrollment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrollment -d enrollment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  enrollment-service:
    build: ./Backend/enrollment-service
    depends_on:
      enrollment-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      PORT: "8083"
      DEBUG: "False"
      SECRET_KEY: dev-secret-key-enrollment-docker
      ALLOWED_HOSTS: enrollment-service,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      DB_NAME: enrollment_db
      DB_USER: enrollment
      DB_PASSWORD: enrollment_dev_password
      DB_HOST: enrollment-db
      DB_PORT: "5432"
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOST: enrollment-service
    restart: unless-stopped


  user-db:
    image: mysql:8.4
    # Pas de port publie : evite le conflit avec MAMP / un MySQL local sur 3306
    environment:
      MYSQL_DATABASE: campushub_users
      MYSQL_USER: campushub_app
      MYSQL_PASSWORD: user_dev_password
      MYSQL_ROOT_PASSWORD: user_root_dev_password
    volumes:
      - user_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # User Service (Spring Boot) : profils des utilisateurs. L'identite (comptes, mots de passe,
  # roles) est dans Keycloak ; la table users est un simple profil, id = sub du token.
  user-service:
    build: ./Backend/USERMICROSERVICE
    depends_on:
      user-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: user-db
      DB_PORT: "3306"
      DB_NAME: campushub_users
      DB_USERNAME: campushub_app
      DB_PASSWORD: user_dev_password
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      # iss attendu dans les tokens (adresse vue par le navigateur)
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      # cles publiques lues par le reseau Docker
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOST: user-service
    restart: unless-stopped

  # Reclamation Service (Django) : reclamations + assistant RAG, joignable seulement par la Gateway
  reclamation-service:
    build: ./Backend/reclamation/rag_project
    image: campushub/reclamation-service
    environment:
      PORT: "8087"
      DJANGO_DEBUG: "false"
      # Vide = cle aleatoire generee une fois dans le volume (/data/.django-secret-key)
      DJANGO_SECRET_KEY: ${RECLAMATION_DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: reclamation-service,localhost,127.0.0.1
      # SQLite (RAG, comptes locaux), index ChromaDB, PDF importes : un seul volume, /data
      DJANGO_DB_PATH: /data/db.sqlite3
      RAG_CHROMA_DIR: /data/chroma
      RAG_PDF_DIR: /data/pdfs
      # MongoDB partage : une base propre au service (comme campushub_forum)
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_NAME: campushub_reclamation
      # Le token garde l'issuer localhost:8180 ; les cles publiques sont lues sur le reseau Docker
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      # Eureka : RECLAMATION-SERVICE, joignable par la Gateway sous ce nom (lb://reclamation-service)
      EUREKA_ENABLED: "true"
      EUREKA_HOST: eureka-server
      EUREKA_PORT: "8761"
      EUREKA_INSTANCE_HOST: reclamation-service
      EUREKA_INSTANCE_PORT: "8087"
      # Liens de pagination (next / previous) par la Gateway
      PUBLIC_API_URL: http://localhost:8080/api/v1/reclamation
      # Appel synchrone Reclamation -> Course (direct, jamais par la Gateway ; 3 s, un essai)
      COURSE_SERVICE_URL: http://course-service:8082
      # Evenements pour Notification (file reclamation.events, declaree par notification-consumer).
      # Best effort : une panne RabbitMQ ne fait jamais echouer une requete. "false" = aucun envoi.
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RECLAMATION_EVENTS_ENABLED: ${RECLAMATION_EVENTS_ENABLED:-true}
      # Assistant RAG : fournisseur compatible OpenAI (Gemini par defaut). Sans cle (vide), la reclamation
      # et les regles marchent ; /academic-assistant/ask et l'ajout de documents repondent 503
      # "provider is not configured" (aucun appel au fournisseur).
      EMBED_BASE_URL: ${RECLAMATION_EMBED_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      EMBED_API_KEY: ${RECLAMATION_EMBED_API_KEY:-}
      EMBED_MODEL: ${RECLAMATION_EMBED_MODEL:-gemini-embedding-001}
      LLM_BASE_URL: ${RECLAMATION_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      LLM_API_KEY: ${RECLAMATION_LLM_API_KEY:-}
      LLM_MODEL: ${RECLAMATION_LLM_MODEL:-gemini-3.5-flash}
      LLM_REASONING_EFFORT: ${RECLAMATION_LLM_REASONING_EFFORT:-low}
      # "true" = importer le reglement au demarrage (appelle le fournisseur d'embeddings ; deja importe = rien)
      RAG_INGEST_ON_START: ${RECLAMATION_INGEST_ON_START:-false}
    volumes:
      - reclamation_data:/data
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    # Le temps de se desinscrire d'Eureka avant l'arret de waitress
    stop_grace_period: 30s
    restart: unless-stopped
    # Debogage seulement (appels directs sans la Gateway) :
    # ports:
    #   - "127.0.0.1:8087:8087"

volumes:
  keycloak_data:
  mongo_data:
  rabbitmq_data:
  course_postgres_data:
  mssql-data:
  enrollment_db_data:
  reclamation_data:
  user_db_data: