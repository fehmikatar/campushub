# CampusHub - lancement dockerise (une seule machine)
#   docker compose up --build -d
# Acces : Gateway http://localhost:8080 | Keycloak http://localhost:8180 (admin/admin)
#         Eureka http://localhost:8761  | RabbitMQ http://localhost:15672 (guest/guest)
#
# Chaque service ajoute SON bloc ici.
# Les services pas encore dockerises tournent sur la machine hote : la Gateway et Forum
# les joignent par host.docker.internal.

name: campushub

include:
  - path: Backend/notification-service/docker-compose.yml

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mongo:
    image: mongo:7
    # Pas de port publie : evite le conflit avec un MongoDB local sur 27017
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  eureka-server:
    build: ./Backend/eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./Backend/api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # iss attendu dans les tokens (adresse vue par le navigateur)
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      # cles publiques lues par le reseau Docker
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      # User Service tourne encore sur la machine hote
      USER_SERVICE_URI: http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - eureka-server
      - keycloak

  forum-service:
    build: ./Backend/forum-service
    environment:
      PORT: 8086
      MONGO_URI: mongodb://mongo:27017/campushub_forum
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      EUREKA_ENABLED: "true"
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      EUREKA_INSTANCE_HOST: forum-service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_QUEUE: forum.events
      # Passer a "true" quand Course valide les tokens Keycloak (sinon Course repond 401)
      COURSE_CHECK_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started

  # Course Service et sa base PostgreSQL
  course-service:
    build: ./Backend/course-service
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: "8082"
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: course_db
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      EUREKA_ENABLED: "true"
      EUREKA_HOST: eureka-server
      EUREKA_PORT: "8761"
      EUREKA_INSTANCE_HOST: course-service
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: course_db
    volumes:
      - course_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Evaluation (SQL Server + API .NET + migrations EF) ---
  # Mot de passe SA : definir MSSQL_SA_PASSWORD dans un fichier .env a la racine (non committe).
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-CampusHub!2026}
    # Pas de port publie (les migrations et l'API passent par le reseau Docker).
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Applique les migrations EF une seule fois, puis s'arrete (voir Dockerfile, etape "migrate").
  evaluation-migrate:
    build:
      context: ./Backend/evaluation-service
      target: migrate
    image: campushub/evaluation-service-migrate
    environment:
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=EvaluationDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-CampusHub!2026};TrustServerCertificate=True;"
      # Suffit a demarrer le host en mode Keycloak (sinon JWT_SECRET serait exige).
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"

  evaluation-service:
    build: ./Backend/evaluation-service
    image: campushub/evaluation-service
    environment:
      # Definition = Swagger disponible sur http://localhost:8084/swagger
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8084
      Urls: http://0.0.0.0:8084
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=EvaluationDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-CampusHub!2026};TrustServerCertificate=True;"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # iss vu par le navigateur ; cles publiques lues par le reseau Docker (comme forum/gateway).
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      # Enregistrement dans l'Eureka du compose (la Gateway resout lb://evaluation-service).
      Eureka__Client__ServiceUrl: http://eureka-server:8761/eureka/
      Eureka__Instance__HostName: evaluation-service
      Eureka__Instance__Port: "8084"
      Eureka__Instance__InstanceId: evaluation-service:8084
      # Course tourne encore sur la machine hote (PostgreSQL, port 8082).
      COURSE_SERVICE_URL: ${COURSE_SERVICE_URL:-http://course-service:8082}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
    ports:
      - "8084:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mssql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
      keycloak:
        condition: service_started
      evaluation-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  enrollment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enrollment_db
      POSTGRES_USER: enrollment
      POSTGRES_PASSWORD: enrollment_dev_password
    volumes:
      - enrollment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrollment -d enrollment_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  enrollment-service:
    build: ./Backend/enrollment-service
    depends_on:
      enrollment-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      PORT: "8083"
      DEBUG: "False"
      SECRET_KEY: dev-secret-key-enrollment-docker
      ALLOWED_HOSTS: enrollment-service,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      DB_NAME: enrollment_db
      DB_USER: enrollment
      DB_PASSWORD: enrollment_dev_password
      DB_HOST: enrollment-db
      DB_PORT: "5432"
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/campushub
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/campushub/protocol/openid-connect/certs
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOST: enrollment-service
    restart: unless-stopped

volumes:
  keycloak_data:
  mongo_data:
  rabbitmq_data:
  course_postgres_data:
  mssql-data:
  enrollment_db_data:
